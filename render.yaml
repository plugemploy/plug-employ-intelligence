# Render setup (Blueprint): the web app and its Postgres database.
# Keys are not stored here: Render asks for each "sync: false" value when the Blueprint is created.
databases:
  - name: plug-employ-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "17"

services:
  - type: web
    name: plug-employ-leads
    runtime: python
    plan: starter  # always on, so the 2am nightly search runs
    region: ohio
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: TZ
        value: America/New_York  # nightly search and Monday digest times are Eastern
      - key: DATABASE_URL
        fromDatabase:
          name: plug-employ-db
          property: connectionString
      - key: APP_BASE_URL  # e.g. https://plug-employ-leads.onrender.com
        sync: false
      - key: APP_SECRET_KEY  # must be the same as on the Mac, or saved Gmail connections stop working
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: CLOSE_API_KEY
        sync: false
      - key: MONTHLY_API_BUDGET_USD
        value: "50"
      - key: STRIPE_SECRET_KEY
        sync: false
