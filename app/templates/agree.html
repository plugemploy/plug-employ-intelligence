{% extends "public.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-1">One quick thing</h1>
<p class="text-sm text-slate-600 mb-6">Please tick the box below to keep using Plug Employ{% if person.name %}, {{ person.name.split()[0] }}{% endif %}.</p>
{% if message %}<p class="mb-4 rounded bg-amber-50 border border-amber-200 p-3 text-sm text-amber-900">{{ message }}</p>{% endif %}
<form method="post" action="/agree" class="grid gap-4">
  {% include "_agree_box.html" %}
  <button class="rounded-lg bg-slate-800 text-white px-4 py-2 font-medium">Continue</button>
</form>
<form method="post" action="/logout" class="mt-6"><button class="text-sm text-slate-500 hover:underline">Sign out</button></form>
{% endblock %}
